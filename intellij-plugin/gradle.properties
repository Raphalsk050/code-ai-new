# Android Studio release the plugin is built against when no local IDE is given
# (see README: "Build"). Its build number is what `sinceBuild` is taken from.
platformVersion = 2025.3.2.6
sinceBuild = 253
# The JetBrains Runtime that Android Studio release runs on (Help | About), as
# <java version>b<build>. The sandbox IDE uses its variant with JCEF.
jbrVersion = 21.0.9b1163.94

kotlin.stdlib.default.dependency = false
kotlin.code.style = official

org.gradle.caching = true
org.gradle.configuration-cache = true
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
