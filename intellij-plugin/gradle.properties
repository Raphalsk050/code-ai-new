# Android Studio release the plugin is built against when no installed IDE is
# given (see README: "Build"). Its build number is what `sinceBuild` is taken from.
platformVersion = 2025.3.2.6
sinceBuild = 253
# The JetBrains Runtime that release runs on (Help | About), as
# <java version>b<build>: the two change together. Up to 2025.3 the embedded
# browser is the runtime's, and the sandbox IDE uses the variant that has it.
# An installed IDE says its own runtime, and from 2026.1 none is needed.
platformJbrVersion = 21.0.9b1163.94

kotlin.stdlib.default.dependency = false
kotlin.code.style = official

org.gradle.caching = true
org.gradle.configuration-cache = true
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
