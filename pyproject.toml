[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-ai"
version = "0.1.0"
description = "Terminal-based coding agent with normalized providers, tools, events, and a Textual UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "httpx>=0.25.0",
  "textual>=0.50.0",
  "tiktoken>=0.5.0",
  "pyte>=0.8.0",
  "pexpect>=4.8.0; platform_system != 'Windows'",
  "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]

[project.scripts]
code-ai = "code_ai.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"code_ai.ui.terminal" = ["theme.tcss", "banner.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
