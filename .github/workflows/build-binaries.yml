name: Build standalone binaries

# One-file executables for Linux and Windows, a macOS build with its own
# Python, the VSCode extension and the Android Studio plugin carrying each, and
# a GitHub release with all of them. Users run them with no Python installed.
#
# code-linux is the company's only runner: GitHub-hosted ones are unreachable
# from that network, and upload-artifact is pinned to v3 because v4 does not
# exist there. Docker is all either job needs from the machine.
#
# The `runner` dropdown on a manual run picks the other environment, where the
# constraint is the mirror image: github.com refuses v3 outright. The two
# versions cannot share a job - the refusal happens while the job resolves its
# actions, before any step-level `if` is read - so each set of jobs carries one
# version and the dropdown decides which set runs. A job that does not run
# resolves nothing, which is what makes this work at all.
#
# Everything unattended, and a manual run left alone, uses code-linux with v3.
#
# No Windows runner, so the .exe is cross-built under Wine - PyInstaller
# cannot cross-compile.
#
# Every artifact and release asset is named after src/code_ai/version.json
# (code-ai-win-v0.27.1.exe, ...), read by the "Read the version" steps.
#
# PIP_TRUSTED_HOST: the proxy re-signs TLS with a certificate the containers
# do not have. PIP_CACHE_DIR: mounted off the runner's disk, or every run
# re-downloads Playwright twice. npm_config_cache likewise, for the extension.

env:
  PIP_TRUSTED_HOST: "pypi.org files.pythonhosted.org"

# Any branch: a packaging break should surface on the push that caused it, not
# at the tag. "**" because branch names have slashes.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner"
        type: choice
        default: code-linux
        options:
          - code-linux
          - ubuntu-latest
  push:
    branches: ["**"]
    tags: ["v*"]

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64
    # Anything but an explicit ubuntu-latest, which includes every push.
    if: inputs.runner != 'ubuntu-latest'
    runs-on: code-linux
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        run: |
          v() { sed -n "s/.*\"$1\": *\([0-9]*\).*/\1/p" src/code_ai/version.json; }
          echo "CODE_AI_VERSION=$(v major).$(v minor).$(v patch)" >> "$GITHUB_ENV"

      # Built inside a Debian Bullseye image (glibc 2.31) so the resulting
      # binary runs on a wide range of older Linux distributions too.
      - name: Build Linux binary
        run: |
          cache="$HOME/.cache/code-ai-ci/pip-linux"
          mkdir -p "$cache"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PIP_TRUSTED_HOST \
            -e PIP_CACHE_DIR=/pip-cache \
            -v "$cache":/pip-cache \
            -v "$PWD":/work -w /work \
            python:3.12-bullseye \
            bash -euxc '
              python -m venv /tmp/venv
              . /tmp/venv/bin/activate
              pip install --upgrade pip
              pip install .
              pip install "pyinstaller>=6,<7"
              pyinstaller --clean --noconfirm packaging/code-ai.spec
              ./dist/code-ai --help
              ./dist/code-ai doctor browser --no-launch
            '

      - name: Stage artifact
        run: |
          mkdir -p out
          cp dist/code-ai "out/code-ai-linux-v$CODE_AI_VERSION"
          chmod +x "out/code-ai-linux-v$CODE_AI_VERSION"

      - uses: actions/upload-artifact@v3
        with:
          name: code-ai-linux-v${{ env.CODE_AI_VERSION }}
          path: out/code-ai-linux-v${{ env.CODE_AI_VERSION }}
          if-no-files-found: error

  windows:
    name: Windows x86_64 (cross-built on Linux via Wine)
    # Anything but an explicit ubuntu-latest, which includes every push.
    if: inputs.runner != 'ubuntu-latest'
    runs-on: code-linux
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        run: |
          v() { sed -n "s/.*\"$1\": *\([0-9]*\).*/\1/p" src/code_ai/version.json; }
          echo "CODE_AI_VERSION=$(v major).$(v minor).$(v patch)" >> "$GITHUB_ENV"

      # The interpreter reports itself as win32, so pip pulls Windows wheels -
      # Playwright's included, with its node.exe. Separate cache from the Linux
      # job for that reason, and a Windows path because this pip is a Windows
      # program (Wine maps Z: to /).
      - name: Build Windows binary inside Wine
        run: |
          cache="$HOME/.cache/code-ai-ci/pip-wine"
          mkdir -p "$cache"
          docker run --rm \
            -e PIP_TRUSTED_HOST \
            -e 'PIP_CACHE_DIR=Z:\pip-cache' \
            -v "$cache":/pip-cache \
            -v "$PWD":/work -w /work \
            tobix/pywine:3.12 \
            bash -euxc '
              wine python -m pip install --upgrade pip
              wine python -m pip install .
              wine python -m pip install "pyinstaller>=6,<7"
              wine python -m PyInstaller --clean --noconfirm packaging/code-ai.spec
              wine dist/code-ai.exe --help || echo "wine smoke test non-fatal"
              wine dist/code-ai.exe doctor browser --no-launch || echo "wine driver check non-fatal"
            '

      # Wine builds as root. Hand the output and the cache back, or the next
      # run cannot write either.
      - name: Fix output ownership
        if: always()
        run: |
          docker run --rm \
            -v "$PWD":/work \
            -v "$HOME/.cache/code-ai-ci/pip-wine":/pip-cache \
            alpine \
            sh -c 'chown -R '"$(id -u):$(id -g)"' /work/dist /work/build /pip-cache 2>/dev/null || true'

      - name: Stage artifact
        run: |
          mkdir -p out
          cp dist/code-ai.exe "out/code-ai-win-v$CODE_AI_VERSION.exe"

      - uses: actions/upload-artifact@v3
        with:
          name: code-ai-win-v${{ env.CODE_AI_VERSION }}
          path: out/code-ai-win-v${{ env.CODE_AI_VERSION }}.exe
          if-no-files-found: error

  # ---- macOS, assembled on Linux ---------------------------------------------
  # PyInstaller cannot build for a Mac anywhere else, but the Mac build is not
  # frozen: scripts/build_mac_bundle.py unpacks a macOS Python and installs the
  # macOS wheels into it, nothing compiled. Running it takes a Mac, which the
  # macos-check job does once one is registered. A failure here costs the
  # release its macOS files, never the rest.

  macos:
    name: macOS arm64 + x86_64 (assembled on Linux)
    if: inputs.runner != 'ubuntu-latest'
    runs-on: code-linux
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        run: |
          v() { sed -n "s/.*\"$1\": *\([0-9]*\).*/\1/p" src/code_ai/version.json; }
          echo "CODE_AI_VERSION=$(v major).$(v minor).$(v patch)" >> "$GITHUB_ENV"

      # The macOS Python comes from github.com; the repository variable
      # CODE_AI_PBS_MIRROR points at an internal copy if that is blocked.
      - name: Assemble the macOS builds
        env:
          CODE_AI_PBS_MIRROR: ${{ vars.CODE_AI_PBS_MIRROR }}
        run: |
          cache="$HOME/.cache/code-ai-ci/mac"
          mkdir -p "$cache/pip"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PIP_TRUSTED_HOST \
            -e PIP_CACHE_DIR=/cache/pip \
            -e CODE_AI_BUILD_CACHE=/cache \
            -e CODE_AI_PBS_MIRROR \
            -v "$cache":/cache \
            -v "$PWD":/work -w /work \
            python:3.12-bullseye \
            python scripts/build_mac_bundle.py --out out

      # Only for the vsix job, which packs it into the Mac downloads.
      - uses: actions/upload-artifact@v3
        with:
          name: internal-mac-bundle-v${{ env.CODE_AI_VERSION }}
          path: out/code-ai-mac-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # ---- the same two binaries, on a GitHub-hosted runner --------------------
  # Only these mention v4, and they are skipped unless the dropdown asks for
  # them. No PIP_TRUSTED_HOST: that gets past a proxy which re-signs TLS, and
  # there is none here. The machine is thrown away, so the caches go through
  # actions/cache and the setup actions instead of staying on its disk.

  linux-public:
    name: Linux x86_64 (GitHub-hosted)
    if: inputs.runner == 'ubuntu-latest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        run: |
          v() { sed -n "s/.*\"$1\": *\([0-9]*\).*/\1/p" src/code_ai/version.json; }
          echo "CODE_AI_VERSION=$(v major).$(v minor).$(v patch)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/code-ai-ci/pip-linux
          key: pip-linux-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-linux-

      - name: Build Linux binary
        run: |
          cache="$HOME/.cache/code-ai-ci/pip-linux"
          mkdir -p "$cache"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PIP_CACHE_DIR=/pip-cache \
            -v "$cache":/pip-cache \
            -v "$PWD":/work -w /work \
            python:3.12-bullseye \
            bash -euxc '
              python -m venv /tmp/venv
              . /tmp/venv/bin/activate
              pip install --upgrade pip
              pip install .
              pip install "pyinstaller>=6,<7"
              pyinstaller --clean --noconfirm packaging/code-ai.spec
              ./dist/code-ai --help
              ./dist/code-ai doctor browser --no-launch
            '

      - name: Stage artifact
        run: |
          mkdir -p out
          cp dist/code-ai "out/code-ai-linux-v$CODE_AI_VERSION"
          chmod +x "out/code-ai-linux-v$CODE_AI_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: code-ai-linux-v${{ env.CODE_AI_VERSION }}
          path: out/code-ai-linux-v${{ env.CODE_AI_VERSION }}
          if-no-files-found: error

  windows-public:
    name: Windows x86_64 (GitHub-hosted, cross-built via Wine)
    if: inputs.runner == 'ubuntu-latest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        run: |
          v() { sed -n "s/.*\"$1\": *\([0-9]*\).*/\1/p" src/code_ai/version.json; }
          echo "CODE_AI_VERSION=$(v major).$(v minor).$(v patch)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/code-ai-ci/pip-wine
          key: pip-wine-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-wine-

      - name: Build Windows binary inside Wine
        run: |
          cache="$HOME/.cache/code-ai-ci/pip-wine"
          mkdir -p "$cache"
          docker run --rm \
            -e 'PIP_CACHE_DIR=Z:\pip-cache' \
            -v "$cache":/pip-cache \
            -v "$PWD":/work -w /work \
            tobix/pywine:3.12 \
            bash -euxc '
              wine python -m pip install --upgrade pip
              wine python -m pip install .
              wine python -m pip install "pyinstaller>=6,<7"
              wine python -m PyInstaller --clean --noconfirm packaging/code-ai.spec
              wine dist/code-ai.exe --help || echo "wine smoke test non-fatal"
              wine dist/code-ai.exe doctor browser --no-launch || echo "wine driver check non-fatal"
            '

      - name: Fix output ownership
        if: always()
        run: |
          docker run --rm \
            -v "$PWD":/work \
            -v "$HOME/.cache/code-ai-ci/pip-wine":/pip-cache \
            alpine \
            sh -c 'chown -R '"$(id -u):$(id -g)"' /work/dist /work/build /pip-cache 2>/dev/null || true'

      - name: Stage artifact
        run: |
          mkdir -p out
          cp dist/code-ai.exe "out/code-ai-win-v$CODE_AI_VERSION.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: code-ai-win-v${{ env.CODE_AI_VERSION }}
          path: out/code-ai-win-v${{ env.CODE_AI_VERSION }}.exe
          if-no-files-found: error

  macos-public:
    name: macOS arm64 + x86_64 (GitHub-hosted, assembled on Linux)
    if: inputs.runner == 'ubuntu-latest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        run: |
          v() { sed -n "s/.*\"$1\": *\([0-9]*\).*/\1/p" src/code_ai/version.json; }
          echo "CODE_AI_VERSION=$(v major).$(v minor).$(v patch)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/code-ai-ci/mac
          key: mac-${{ hashFiles('scripts/build_mac_bundle.py', 'pyproject.toml') }}
          restore-keys: mac-

      - name: Assemble the macOS builds
        run: |
          cache="$HOME/.cache/code-ai-ci/mac"
          mkdir -p "$cache/pip"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PIP_CACHE_DIR=/cache/pip \
            -e CODE_AI_BUILD_CACHE=/cache \
            -v "$cache":/cache \
            -v "$PWD":/work -w /work \
            python:3.12-bullseye \
            python scripts/build_mac_bundle.py --out out

      # Only for the vsix job, which packs it into the Mac downloads.
      - uses: actions/upload-artifact@v4
        with:
          name: internal-mac-bundle-v${{ env.CODE_AI_VERSION }}
          path: out/code-ai-mac-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # ---- the VSCode extension ------------------------------------------------
  # One VSIX per platform, each carrying the binary built above, so installing
  # it needs nothing else on the machine. scripts/package.mjs fails the build if
  # a package would ship without its backend, with the wrong platform's, or
  # without the executable bit. For macOS it also writes what Mac users
  # download: the command and the extension in one file (packaging/mac-install.sh).

  vsix:
    name: VSCode extension
    needs: [linux, windows, macos]
    # macOS is extra: when its build fails, the other packages still ship.
    if: >-
      !cancelled() && inputs.runner != 'ubuntu-latest'
      && needs.linux.result == 'success' && needs.windows.result == 'success'
    runs-on: code-linux
    outputs:
      version: ${{ steps.version.outputs.value }}
      mac: ${{ steps.package.outputs.mac }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          v() { sed -n "s/.*\"$1\": *\([0-9]*\).*/\1/p" src/code_ai/version.json; }
          echo "CODE_AI_VERSION=$(v major).$(v minor).$(v patch)" >> "$GITHUB_ENV"
          echo "value=$(v major).$(v minor).$(v patch)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v3
        with:
          name: code-ai-linux-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/download-artifact@v3
        with:
          name: code-ai-win-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/download-artifact@v3
        if: needs.macos.result == 'success'
        with:
          name: internal-mac-bundle-v${{ env.CODE_AI_VERSION }}
          path: out

      # Node comes from the same container pattern as the binaries: the runner
      # itself is only asked for Docker.
      - name: Build the packages
        id: package
        run: |
          chmod +x "out/code-ai-linux-v$CODE_AI_VERSION"
          CODE_AI_MAC_ARGS=""
          for arch in arm64 x64; do
            bundle="out/code-ai-mac-$arch-v$CODE_AI_VERSION.tar.gz"
            if [ -f "$bundle" ]; then
              tar -xzf "$bundle" -C out
              CODE_AI_MAC_ARGS="$CODE_AI_MAC_ARGS --mac-$arch ../out/code-ai-mac-$arch"
            fi
          done
          export CODE_AI_MAC_ARGS
          if [ -n "$CODE_AI_MAC_ARGS" ]; then echo "mac=true" >> "$GITHUB_OUTPUT"; fi
          npm_cache="$HOME/.cache/code-ai-ci/npm"
          mkdir -p "$npm_cache"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e npm_config_cache=/npm-cache \
            -v "$npm_cache":/npm-cache \
            -e CODE_AI_VERSION \
            -e CODE_AI_MAC_ARGS \
            -v "$PWD":/work -w /work/vscode-extension \
            node:20-bookworm \
            bash -euxc '
              npm ci --no-audit --no-fund || npm install --no-audit --no-fund
              node scripts/package.mjs \
                --linux "../out/code-ai-linux-v$CODE_AI_VERSION" \
                --win "../out/code-ai-win-v$CODE_AI_VERSION.exe" \
                $CODE_AI_MAC_ARGS
            '

      # One artifact per platform, so a download holds only what it is for.
      - name: Stage artifacts
        run: |
          mkdir -p out/vsix out/mac
          for vsix in vscode-extension/vsix/*.vsix; do
            target="${vsix##*-$CODE_AI_VERSION-}"
            target="${target%.vsix}"
            mkdir -p "out/vsix/$target"
            cp "$vsix" "out/vsix/$target/code-ai-vscode-v$CODE_AI_VERSION-$target.vsix"
          done
          for arch in arm64 x64; do
            installer="vscode-extension/vsix/code-ai-mac-$arch-v$CODE_AI_VERSION.sh"
            if [ -f "$installer" ]; then
              mkdir -p "out/mac/$arch"
              cp "$installer" "out/mac/$arch/"
            fi
          done
          find out/vsix out/mac -type f | sort

      - uses: actions/upload-artifact@v3
        with:
          name: code-ai-vscode-v${{ env.CODE_AI_VERSION }}-win32-x64
          path: out/vsix/win32-x64/*.vsix
          if-no-files-found: error

      - uses: actions/upload-artifact@v3
        with:
          name: code-ai-vscode-v${{ env.CODE_AI_VERSION }}-linux-x64
          path: out/vsix/linux-x64/*.vsix
          if-no-files-found: error

      - uses: actions/upload-artifact@v3
        if: steps.package.outputs.mac == 'true'
        with:
          name: code-ai-vscode-v${{ env.CODE_AI_VERSION }}-darwin-arm64
          path: out/vsix/darwin-arm64/*.vsix
          if-no-files-found: error

      - uses: actions/upload-artifact@v3
        if: steps.package.outputs.mac == 'true'
        with:
          name: code-ai-vscode-v${{ env.CODE_AI_VERSION }}-darwin-x64
          path: out/vsix/darwin-x64/*.vsix
          if-no-files-found: error

      - uses: actions/upload-artifact@v3
        if: steps.package.outputs.mac == 'true'
        with:
          name: code-ai-mac-arm64-v${{ env.CODE_AI_VERSION }}
          path: out/mac/arm64/*.sh
          if-no-files-found: error

      - uses: actions/upload-artifact@v3
        if: steps.package.outputs.mac == 'true'
        with:
          name: code-ai-mac-x64-v${{ env.CODE_AI_VERSION }}
          path: out/mac/x64/*.sh
          if-no-files-found: error

  vsix-public:
    name: VSCode extension (GitHub-hosted)
    needs: [linux-public, windows-public, macos-public]
    if: >-
      !cancelled() && inputs.runner == 'ubuntu-latest'
      && needs.linux-public.result == 'success' && needs.windows-public.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      mac: ${{ steps.package.outputs.mac }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          v() { sed -n "s/.*\"$1\": *\([0-9]*\).*/\1/p" src/code_ai/version.json; }
          echo "CODE_AI_VERSION=$(v major).$(v minor).$(v patch)" >> "$GITHUB_ENV"
          echo "value=$(v major).$(v minor).$(v patch)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: code-ai-linux-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: code-ai-win-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/download-artifact@v4
        if: needs.macos-public.result == 'success'
        with:
          name: internal-mac-bundle-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Build the packages
        id: package
        working-directory: vscode-extension
        run: |
          chmod +x "../out/code-ai-linux-v$CODE_AI_VERSION"
          mac_args=""
          for arch in arm64 x64; do
            bundle="../out/code-ai-mac-$arch-v$CODE_AI_VERSION.tar.gz"
            if [ -f "$bundle" ]; then
              tar -xzf "$bundle" -C ../out
              mac_args="$mac_args --mac-$arch ../out/code-ai-mac-$arch"
            fi
          done
          if [ -n "$mac_args" ]; then echo "mac=true" >> "$GITHUB_OUTPUT"; fi
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          node scripts/package.mjs \
            --linux "../out/code-ai-linux-v$CODE_AI_VERSION" \
            --win "../out/code-ai-win-v$CODE_AI_VERSION.exe" \
            $mac_args

      # One artifact per platform, so a download holds only what it is for.
      - name: Stage artifacts
        run: |
          mkdir -p out/vsix out/mac
          for vsix in vscode-extension/vsix/*.vsix; do
            target="${vsix##*-$CODE_AI_VERSION-}"
            target="${target%.vsix}"
            mkdir -p "out/vsix/$target"
            cp "$vsix" "out/vsix/$target/code-ai-vscode-v$CODE_AI_VERSION-$target.vsix"
          done
          for arch in arm64 x64; do
            installer="vscode-extension/vsix/code-ai-mac-$arch-v$CODE_AI_VERSION.sh"
            if [ -f "$installer" ]; then
              mkdir -p "out/mac/$arch"
              cp "$installer" "out/mac/$arch/"
            fi
          done
          find out/vsix out/mac -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: code-ai-vscode-v${{ env.CODE_AI_VERSION }}-win32-x64
          path: out/vsix/win32-x64/*.vsix
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: code-ai-vscode-v${{ env.CODE_AI_VERSION }}-linux-x64
          path: out/vsix/linux-x64/*.vsix
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.mac == 'true'
        with:
          name: code-ai-vscode-v${{ env.CODE_AI_VERSION }}-darwin-arm64
          path: out/vsix/darwin-arm64/*.vsix
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.mac == 'true'
        with:
          name: code-ai-vscode-v${{ env.CODE_AI_VERSION }}-darwin-x64
          path: out/vsix/darwin-x64/*.vsix
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.mac == 'true'
        with:
          name: code-ai-mac-arm64-v${{ env.CODE_AI_VERSION }}
          path: out/mac/arm64/*.sh
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.mac == 'true'
        with:
          name: code-ai-mac-x64-v${{ env.CODE_AI_VERSION }}
          path: out/mac/x64/*.sh
          if-no-files-found: error

  # ---- the Android Studio plugin -----------------------------------------------
  # The same panel and the same backend as the VSCode extension, in a package an
  # IntelliJ-based IDE installs from disk: one for each system, carrying the
  # backend built above (intellij-plugin/scripts/release-packages.sh). It is
  # extra, as macOS is: when it fails, the release ships without it. The
  # release waits for it all the same, hence the time limit: the first build on
  # a runner downloads the IDE, and one that hangs must not hold a release up.

  plugin:
    name: Android Studio plugin
    needs: [linux, windows, macos]
    if: >-
      !cancelled() && inputs.runner != 'ubuntu-latest'
      && needs.linux.result == 'success' && needs.windows.result == 'success'
    runs-on: code-linux
    timeout-minutes: 90
    outputs:
      mac: ${{ steps.package.outputs.mac }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        run: |
          v() { sed -n "s/.*\"$1\": *\([0-9]*\).*/\1/p" src/code_ai/version.json; }
          echo "CODE_AI_VERSION=$(v major).$(v minor).$(v patch)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v3
        with:
          name: code-ai-linux-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/download-artifact@v3
        with:
          name: code-ai-win-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/download-artifact@v3
        if: needs.macos.result == 'success'
        with:
          name: internal-mac-bundle-v${{ env.CODE_AI_VERSION }}
          path: out

      # Two containers, as the tools come. Node bundles the panel and lays each
      # backend out as its package carries it; Java then builds the packages,
      # told the panel is bundled already, having no Node to do it with. What
      # Gradle downloads - the IDE it builds against is over a gigabyte - stays
      # on the runner between builds.
      #
      # The proxy re-signs TLS with a certificate the container does not have,
      # and Java has no PIP_TRUSTED_HOST to look away with. It is handed the
      # certificates the runner itself trusts, which should hold the proxy's.
      # Where the runner keeps them somewhere else, the repository variable
      # CODE_AI_CA_BUNDLE names the PEM file.
      #
      # Maven Central answers the proxy's address, which is everyone's, with
      # HTTP 429. The build asks a mirror first, a public one it finds itself;
      # the repository variable CODE_AI_MAVEN_MIRROR names another, the
      # company's own.
      - name: Build the packages
        id: package
        env:
          CODE_AI_CA_BUNDLE: ${{ vars.CODE_AI_CA_BUNDLE }}
          CODE_AI_MAVEN_MIRROR: ${{ vars.CODE_AI_MAVEN_MIRROR }}
        run: |
          chmod +x "out/code-ai-linux-v$CODE_AI_VERSION"
          CODE_AI_PLUGIN_TARGETS="linux-x64 win32-x64"
          for arch in arm64 x64; do
            bundle="out/code-ai-mac-$arch-v$CODE_AI_VERSION.tar.gz"
            if [ -f "$bundle" ]; then
              tar -xzf "$bundle" -C out
              CODE_AI_PLUGIN_TARGETS="$CODE_AI_PLUGIN_TARGETS darwin-$arch"
            fi
          done
          export CODE_AI_PLUGIN_TARGETS
          case "$CODE_AI_PLUGIN_TARGETS" in *darwin*) echo "mac=true" >> "$GITHUB_OUTPUT" ;; esac
          npm_cache="$HOME/.cache/code-ai-ci/npm"
          mkdir -p "$npm_cache"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e npm_config_cache=/npm-cache \
            -v "$npm_cache":/npm-cache \
            -e PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            -e CODE_AI_VERSION \
            -e CODE_AI_PLUGIN_TARGETS \
            -v "$PWD":/work -w /work \
            node:20-bookworm \
            bash -euxc '
              cd vscode-extension
              npm ci --no-audit --no-fund || npm install --no-audit --no-fund
              npm run build
              cd ..
              sh intellij-plugin/scripts/release-packages.sh stage out \
                "$CODE_AI_VERSION" $CODE_AI_PLUGIN_TARGETS
            '
          cache="$HOME/.cache/code-ai-ci/gradle"
          mkdir -p "$cache"
          ca="$CODE_AI_CA_BUNDLE"
          if [ -n "$ca" ] && [ ! -f "$ca" ]; then
            echo "::error::CODE_AI_CA_BUNDLE names $ca, which is not a file on this runner"
            exit 1
          fi
          for known in /etc/ssl/certs/ca-certificates.crt /etc/pki/tls/certs/ca-bundle.crt \
            /etc/ssl/ca-bundle.pem /etc/ssl/cert.pem; do
            if [ -z "$ca" ] && [ -f "$known" ]; then ca="$known"; fi
          done
          set --
          if [ -n "$ca" ]; then
            set -- -v "$ca":/runner-ca.pem:ro -e CODE_AI_CA_BUNDLE=/runner-ca.pem
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e GRADLE_USER_HOME=/cache \
            -e CODE_AI_PANEL_BUNDLED=1 \
            -e CODE_AI_MAVEN_MIRROR \
            "$@" \
            -v "$cache":/cache \
            -v "$PWD":/work -w /work \
            eclipse-temurin:21-jdk \
            sh intellij-plugin/scripts/release-packages.sh build out \
              "$CODE_AI_VERSION" $CODE_AI_PLUGIN_TARGETS
          find out/plugin -type f | sort

      - uses: actions/upload-artifact@v3
        with:
          name: code-ai-android-studio-v${{ env.CODE_AI_VERSION }}-win32-x64
          path: out/plugin/win32-x64/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v3
        with:
          name: code-ai-android-studio-v${{ env.CODE_AI_VERSION }}-linux-x64
          path: out/plugin/linux-x64/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v3
        if: steps.package.outputs.mac == 'true'
        with:
          name: code-ai-android-studio-v${{ env.CODE_AI_VERSION }}-darwin-arm64
          path: out/plugin/darwin-arm64/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v3
        if: steps.package.outputs.mac == 'true'
        with:
          name: code-ai-android-studio-v${{ env.CODE_AI_VERSION }}-darwin-x64
          path: out/plugin/darwin-x64/*.zip
          if-no-files-found: error

  plugin-public:
    name: Android Studio plugin (GitHub-hosted)
    needs: [linux-public, windows-public, macos-public]
    if: >-
      !cancelled() && inputs.runner == 'ubuntu-latest'
      && needs.linux-public.result == 'success' && needs.windows-public.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      mac: ${{ steps.package.outputs.mac }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        run: |
          v() { sed -n "s/.*\"$1\": *\([0-9]*\).*/\1/p" src/code_ai/version.json; }
          echo "CODE_AI_VERSION=$(v major).$(v minor).$(v patch)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: code-ai-linux-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: code-ai-win-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/download-artifact@v4
        if: needs.macos-public.result == 'success'
        with:
          name: internal-mac-bundle-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            intellij-plugin/*.gradle*
            intellij-plugin/gradle.properties
            intellij-plugin/gradle/wrapper/gradle-wrapper.properties

      # Node and Java side by side here, so Gradle bundles the panel itself.
      - name: Build the packages
        id: package
        run: |
          chmod +x "out/code-ai-linux-v$CODE_AI_VERSION"
          targets="linux-x64 win32-x64"
          for arch in arm64 x64; do
            bundle="out/code-ai-mac-$arch-v$CODE_AI_VERSION.tar.gz"
            if [ -f "$bundle" ]; then
              tar -xzf "$bundle" -C out
              targets="$targets darwin-$arch"
            fi
          done
          case "$targets" in *darwin*) echo "mac=true" >> "$GITHUB_OUTPUT" ;; esac
          sh intellij-plugin/scripts/release-packages.sh stage out "$CODE_AI_VERSION" $targets
          sh intellij-plugin/scripts/release-packages.sh build out "$CODE_AI_VERSION" $targets
          find out/plugin -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: code-ai-android-studio-v${{ env.CODE_AI_VERSION }}-win32-x64
          path: out/plugin/win32-x64/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: code-ai-android-studio-v${{ env.CODE_AI_VERSION }}-linux-x64
          path: out/plugin/linux-x64/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.mac == 'true'
        with:
          name: code-ai-android-studio-v${{ env.CODE_AI_VERSION }}-darwin-arm64
          path: out/plugin/darwin-arm64/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.mac == 'true'
        with:
          name: code-ai-android-studio-v${{ env.CODE_AI_VERSION }}-darwin-x64
          path: out/plugin/darwin-x64/*.zip
          if-no-files-found: error

  # ---- the Mac check -----------------------------------------------------------
  # Installs the macOS build as a user does and starts it, on a real Mac: the
  # one step no Linux runner can take (scripts/check_mac_build.sh). On the
  # company side only once a Mac is registered (scripts/setup_mac_runner.sh)
  # and the repository variable CODE_AI_MAC_RUNNER names its label; while that
  # Mac is off, the release waits for it. A failure keeps the macOS files out of
  # the release, never the rest.

  macos-check:
    name: macOS check (company Mac)
    needs: [vsix]
    if: >-
      inputs.runner != 'ubuntu-latest' && vars.CODE_AI_MAC_RUNNER != ''
      && needs.vsix.outputs.mac == 'true'
    runs-on: ${{ vars.CODE_AI_MAC_RUNNER }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v3
        with:
          name: code-ai-mac-arm64-v${{ needs.vsix.outputs.version }}
          path: out

      - uses: actions/download-artifact@v3
        with:
          name: code-ai-mac-x64-v${{ needs.vsix.outputs.version }}
          path: out

      - name: Install and start each build
        run: sh scripts/check_mac_build.sh "${{ needs.vsix.outputs.version }}" out

  macos-check-public:
    name: macOS check (GitHub-hosted Mac)
    needs: [vsix-public]
    if: inputs.runner == 'ubuntu-latest' && needs.vsix-public.outputs.mac == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: code-ai-mac-arm64-v${{ needs.vsix-public.outputs.version }}
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: code-ai-mac-x64-v${{ needs.vsix-public.outputs.version }}
          path: out

      - name: Install and start each build
        run: sh scripts/check_mac_build.sh "${{ needs.vsix-public.outputs.version }}" out

  # ---- the release -----------------------------------------------------------
  # Every build becomes the release for its version (tag vX.Y.Z), with short
  # notes from the feat and perf/refactor commits since the previous release
  # (scripts/release.py). The default branch and tags publish a release; other
  # branches a pre-release. Building a version again moves its tag and replaces
  # the assets.

  release:
    name: GitHub release
    needs: [vsix, macos-check, plugin]
    # With or without a Mac check: see the step that leaves out what it refused.
    # With or without the Android Studio plugin too.
    if: >-
      !cancelled() && inputs.runner != 'ubuntu-latest' && needs.vsix.result == 'success'
    runs-on: code-linux
    permissions:
      contents: write
    steps:
      # The whole history: the notes are the commits since the last release tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version
        run: |
          v() { sed -n "s/.*\"$1\": *\([0-9]*\).*/\1/p" src/code_ai/version.json; }
          echo "CODE_AI_VERSION=$(v major).$(v minor).$(v patch)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v3
        with:
          name: code-ai-linux-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/download-artifact@v3
        with:
          name: code-ai-win-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/download-artifact@v3
        with:
          name: code-ai-vscode-v${{ env.CODE_AI_VERSION }}-win32-x64
          path: out

      - uses: actions/download-artifact@v3
        with:
          name: code-ai-vscode-v${{ env.CODE_AI_VERSION }}-linux-x64
          path: out

      - uses: actions/download-artifact@v3
        if: needs.vsix.outputs.mac == 'true'
        with:
          name: code-ai-vscode-v${{ env.CODE_AI_VERSION }}-darwin-arm64
          path: out

      - uses: actions/download-artifact@v3
        if: needs.vsix.outputs.mac == 'true'
        with:
          name: code-ai-vscode-v${{ env.CODE_AI_VERSION }}-darwin-x64
          path: out

      - uses: actions/download-artifact@v3
        if: needs.vsix.outputs.mac == 'true'
        with:
          name: code-ai-mac-arm64-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/download-artifact@v3
        if: needs.vsix.outputs.mac == 'true'
        with:
          name: code-ai-mac-x64-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/download-artifact@v3
        if: needs.plugin.result == 'success'
        with:
          name: code-ai-android-studio-v${{ env.CODE_AI_VERSION }}-win32-x64
          path: out

      - uses: actions/download-artifact@v3
        if: needs.plugin.result == 'success'
        with:
          name: code-ai-android-studio-v${{ env.CODE_AI_VERSION }}-linux-x64
          path: out

      - uses: actions/download-artifact@v3
        if: needs.plugin.result == 'success' && needs.plugin.outputs.mac == 'true'
        with:
          name: code-ai-android-studio-v${{ env.CODE_AI_VERSION }}-darwin-arm64
          path: out

      - uses: actions/download-artifact@v3
        if: needs.plugin.result == 'success' && needs.plugin.outputs.mac == 'true'
        with:
          name: code-ai-android-studio-v${{ env.CODE_AI_VERSION }}-darwin-x64
          path: out

      - name: Leave out a macOS build the Mac turned down
        if: needs.macos-check.result != 'success' && needs.macos-check.result != 'skipped'
        run: |
          rm -f out/*darwin*.vsix out/*darwin*.zip out/code-ai-mac-*.sh
          echo "::warning::The macOS check did not pass, so this release carries no macOS files."

      - name: Say when the Android Studio plugin is missing
        if: needs.plugin.result != 'success'
        run: |
          echo "::warning::The Android Studio plugin did not build, so this release carries none."

      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          prerelease=--prerelease
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF_TYPE" = tag ]; then
            prerelease=
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e GITHUB_TOKEN -e GITHUB_REPOSITORY -e GITHUB_SHA -e GITHUB_API_URL \
            -e PRERELEASE="$prerelease" \
            -v "$PWD":/work -w /work \
            python:3.12-bullseye \
            bash -euc '
              git config --global --add safe.directory /work
              python scripts/release.py publish $PRERELEASE out/*
            '

  release-public:
    name: GitHub release (GitHub-hosted)
    needs: [vsix-public, macos-check-public, plugin-public]
    if: >-
      !cancelled() && inputs.runner == 'ubuntu-latest' && needs.vsix-public.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version
        run: |
          v() { sed -n "s/.*\"$1\": *\([0-9]*\).*/\1/p" src/code_ai/version.json; }
          echo "CODE_AI_VERSION=$(v major).$(v minor).$(v patch)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: code-ai-linux-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: code-ai-win-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: code-ai-vscode-v${{ env.CODE_AI_VERSION }}-win32-x64
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: code-ai-vscode-v${{ env.CODE_AI_VERSION }}-linux-x64
          path: out

      - uses: actions/download-artifact@v4
        if: needs.vsix-public.outputs.mac == 'true'
        with:
          name: code-ai-vscode-v${{ env.CODE_AI_VERSION }}-darwin-arm64
          path: out

      - uses: actions/download-artifact@v4
        if: needs.vsix-public.outputs.mac == 'true'
        with:
          name: code-ai-vscode-v${{ env.CODE_AI_VERSION }}-darwin-x64
          path: out

      - uses: actions/download-artifact@v4
        if: needs.vsix-public.outputs.mac == 'true'
        with:
          name: code-ai-mac-arm64-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/download-artifact@v4
        if: needs.vsix-public.outputs.mac == 'true'
        with:
          name: code-ai-mac-x64-v${{ env.CODE_AI_VERSION }}
          path: out

      - uses: actions/download-artifact@v4
        if: needs.plugin-public.result == 'success'
        with:
          name: code-ai-android-studio-v${{ env.CODE_AI_VERSION }}-win32-x64
          path: out

      - uses: actions/download-artifact@v4
        if: needs.plugin-public.result == 'success'
        with:
          name: code-ai-android-studio-v${{ env.CODE_AI_VERSION }}-linux-x64
          path: out

      - uses: actions/download-artifact@v4
        if: needs.plugin-public.result == 'success' && needs.plugin-public.outputs.mac == 'true'
        with:
          name: code-ai-android-studio-v${{ env.CODE_AI_VERSION }}-darwin-arm64
          path: out

      - uses: actions/download-artifact@v4
        if: needs.plugin-public.result == 'success' && needs.plugin-public.outputs.mac == 'true'
        with:
          name: code-ai-android-studio-v${{ env.CODE_AI_VERSION }}-darwin-x64
          path: out

      - name: Leave out a macOS build the Mac turned down
        if: >-
          needs.macos-check-public.result != 'success'
          && needs.macos-check-public.result != 'skipped'
        run: |
          rm -f out/*darwin*.vsix out/*darwin*.zip out/code-ai-mac-*.sh
          echo "::warning::The macOS check did not pass, so this release carries no macOS files."

      - name: Say when the Android Studio plugin is missing
        if: needs.plugin-public.result != 'success'
        run: |
          echo "::warning::The Android Studio plugin did not build, so this release carries none."

      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          prerelease=--prerelease
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF_TYPE" = tag ]; then
            prerelease=
          fi
          python3 scripts/release.py publish $prerelease out/*
