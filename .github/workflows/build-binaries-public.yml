name: Build standalone binaries (GitHub-hosted)

# The same two binaries as build-binaries.yml, on a GitHub-hosted runner.
#
# Why a second file rather than a runner dropdown in the first one: github.com
# rejects `actions/upload-artifact@v3` while *resolving* a job's actions, before
# any step-level `if` is read, so a job that merely mentions v3 fails there even
# when the v3 step would have been skipped. The company's Enterprise Server is
# the mirror image - v4 does not resolve at all. Two versions cannot coexist in
# one job, so they live in one workflow each, and the choice is which workflow
# you run.
#
# Manual only. Pushes keep going to build-binaries.yml on code-linux, which is
# the runner the company can actually reach.
#
# No PIP_TRUSTED_HOST here: that exists to get past a proxy that re-signs TLS,
# and a GitHub-hosted runner has no such proxy. No pip cache either - the
# machine is discarded after the run, so there is nothing to cache into.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Which binaries to build"
        type: choice
        default: both
        options:
          - both
          - linux
          - windows

concurrency:
  group: build-binaries-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64
    if: inputs.targets == 'both' || inputs.targets == 'linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Debian Bullseye (glibc 2.31) so the binary also runs on older distros
      # than whatever ubuntu-latest happens to be this month.
      - name: Build Linux binary
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD":/work -w /work \
            python:3.12-bullseye \
            bash -euxc '
              python -m venv /tmp/venv
              . /tmp/venv/bin/activate
              pip install --upgrade pip
              pip install .
              pip install "pyinstaller>=6,<7"
              pyinstaller --clean --noconfirm packaging/code-ai.spec
              ./dist/code-ai --help
              ./dist/code-ai doctor browser --no-launch
            '

      - name: Stage artifact
        run: |
          mkdir -p out
          cp dist/code-ai out/code-ai-linux-x86_64
          chmod +x out/code-ai-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: code-ai-linux-x86_64
          path: out/code-ai-linux-x86_64
          if-no-files-found: error

  windows:
    name: Windows x86_64 (cross-built on Linux via Wine)
    if: inputs.targets == 'both' || inputs.targets == 'windows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PyInstaller cannot cross-compile, so the .exe is built by a real Windows
      # interpreter under Wine. The interpreter reports itself as win32, so pip
      # pulls Windows wheels - Playwright's included, with its node.exe.
      - name: Build Windows binary inside Wine
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            tobix/pywine:3.12 \
            bash -euxc '
              wine python -m pip install --upgrade pip
              wine python -m pip install .
              wine python -m pip install "pyinstaller>=6,<7"
              wine python -m PyInstaller --clean --noconfirm packaging/code-ai.spec
              wine dist/code-ai.exe --help || echo "wine smoke test non-fatal"
              wine dist/code-ai.exe doctor browser --no-launch || echo "wine driver check non-fatal"
            '

      # Wine builds as root; hand the output back or the following steps cannot
      # read it.
      - name: Fix output ownership
        if: always()
        run: |
          docker run --rm -v "$PWD":/work alpine \
            sh -c 'chown -R '"$(id -u):$(id -g)"' /work/dist /work/build 2>/dev/null || true'

      - name: Stage artifact
        run: |
          mkdir -p out
          cp dist/code-ai.exe out/code-ai-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: code-ai-windows-x86_64
          path: out/code-ai-windows-x86_64.exe
          if-no-files-found: error
